<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultPlay — Админ-панель</title>
    <style>
        :root {
            --bg: #060B14;
            --card: #0D1525;
            --accent: #22C55E;
            --accent-hover: #4ADE80;
            --red: #EF4444;
            --text: #F8FAFC;
            --muted: #94A3B8;
            --glass: rgba(13,21,37,0.75);
            --border: rgba(34,197,94,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 15% 0%, rgba(34,197,94,0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 0%, rgba(34,197,94,0.04) 0%, transparent 55%);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(6,11,20,0.95) 0%, rgba(10,15,26,0.85) 100%);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            gap: 16px;
        }
        header .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header .logo-area img {
            height: 32px;
            width: auto;
        }
        header .admin-badge {
            background: var(--accent);
            color: #060B14;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        header .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        header a, header button {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            background: transparent;
            border: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
        }
        header a:hover, header button:hover {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(34,197,94,0.06);
        }
        header a.active {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(34,197,94,0.08);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .badge {
            background: var(--red);
            color: #fff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .section-title .badge:empty {
            display: none;
        }

        /* Таблица */
        .table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            min-width: 700px;
        }
        table th {
            background: rgba(34,197,94,0.05);
            padding: 14px 16px;
            text-align: left;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        table td {
            padding: 12px 16px;
            font-size: 13px;
            border-top: 1px solid rgba(255,255,255,0.03);
            color: var(--muted);
            vertical-align: middle;
        }
        table td.game-name {
            color: var(--text);
            font-weight: 600;
        }
        table .btn-sm {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            white-space: nowrap;
            margin: 2px;
        }
        table .btn-sm:hover {
            background: var(--accent);
            color: #060B14;
            border-color: var(--accent);
        }
        table .btn-sm.danger {
            color: var(--red);
            border-color: rgba(239,68,68,0.3);
        }
        table .btn-sm.danger:hover {
            background: var(--red);
            color: #fff;
            border-color: var(--red);
        }
        table .btn-sm.edit-btn {
            color: #F59E0B;
            border-color: rgba(245,158,11,0.3);
        }
        table .btn-sm.edit-btn:hover {
            background: #F59E0B;
            color: #060B14;
            border-color: #F59E0B;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        /* Форма */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-grid .full-width {
            grid-column: 1 / -1;
        }
        .form-card label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-card input, .form-card textarea, .form-card select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(6,11,20,0.6);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }
        .form-card input:focus, .form-card textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34,197,94,0.08);
        }
        .form-card textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-card .image-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }
        .form-card .categories-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .form-card .cat-check {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: var(--muted);
            transition: all 0.3s;
            user-select: none;
        }
        .form-card .cat-check:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .form-card .cat-check input {
            display: none;
        }
        .form-card .cat-check.checked {
            background: rgba(34,197,94,0.1);
            border-color: var(--accent);
            color: var(--accent);
        }
        .form-card .btn-row {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
        }
        .form-card .submit-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1a9e4b, #22C55E);
            color: #060B14;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .form-card .submit-btn:hover {
            background: linear-gradient(135deg, #22C55E, #4ADE80);
            box-shadow: 0 8px 30px rgba(34,197,94,0.4);
        }
        .form-card .cancel-btn {
            padding: 14px 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-card .cancel-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .success-msg {
            padding: 14px 20px;
            background: rgba(34,197,94,0.1);
            border: 1px solid var(--accent);
            border-radius: 10px;
            color: var(--accent);
            margin-bottom: 20px;
            display: none;
        }
        .success-msg.show {
            display: block;
        }

        /* Модалка авторизации */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2,5,10,0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .auth-box img {
            height: 40px;
            margin-bottom: 16px;
        }
        .auth-box h2 {
            margin-bottom: 8px;
        }
        .auth-box p {
            color: var(--muted);
            margin-bottom: 24px;
            font-size: 14px;
        }
        .auth-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(6,11,20,0.6);
            color: var(--text);
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 16px;
        }
        .auth-box input:focus {
            border-color: var(--accent);
        }
        .auth-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #060B14;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .auth-box .error {
            color: var(--red);
            font-size: 13px;
            margin-top: 8px;
        }

        /* Модалка редактирования */
        .edit-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2,5,10,0.85);
            backdrop-filter: blur(6px);
            z-index: 2000;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .edit-modal-overlay.active {
            display: flex;
        }
        .edit-modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        .edit-modal h3 {
            margin-bottom: 24px;
            font-size: 22px;
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
            }
            .container { padding: 20px 16px; }
            .form-grid {
                grid-template-columns: 1fr;
            }
            table { min-width: 100%; }
            .edit-modal { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- АВТОРИЗАЦИЯ -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <img src="images/logo-text.png" alt="VaultPlay">
            <h2>🔐 Админ-панель</h2>
            <p>Введите пароль для доступа</p>
            <input type="password" id="authPassword" placeholder="Пароль" onkeydown="if(event.key==='Enter')checkAuth()">
            <button onclick="checkAuth()">Войти</button>
            <p class="error" id="authError"></p>
        </div>
    </div>

    <!-- ОСНОВНОЕ -->
    <div id="mainContent" style="display:none;">
        <header>
            <div class="logo-area">
                <img src="images/logo.png" alt="VaultPlay">
                <img src="images/logo-text.png" alt="VaultPlay" style="height:24px;">
                <span class="admin-badge">Admin</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active" onclick="switchTab('reports')">🚫 Жалобы <span id="reportsCountBadge" class="badge"></span></a>
                <a href="#" onclick="switchTab('games')">🎮 Все игры</a>
                <a href="#" onclick="switchTab('add')">➕ Добавить</a>
                <a href="index.html" target="_blank">🌐 Сайт</a>
                <button onclick="logout()">Выход</button>
            </div>
        </header>

        <div class="container">
            <div class="success-msg" id="successMsg"></div>

            <!-- Вкладка Жалобы -->
            <div id="tabReports">
                <div class="section-title">🚫 Игры с жалобами <span class="badge" id="reportsBadge"></span></div>
                <div id="reportsContent"></div>
            </div>

            <!-- Вкладка Все игры -->
            <div id="tabGames" style="display:none;">
                <div class="section-title">🎮 Все игры в базе</div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Обложка</th>
                                <th>Название</th>
                                <th>Год</th>
                                <th>Поп.</th>
                                <th>Категории</th>
                                <th>Логин</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="allGamesTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Вкладка Добавить -->
            <div id="tabAdd" style="display:none;">
                <div class="section-title">➕ Добавить новую игру</div>
                <div class="form-card">
                    <form class="form-grid" id="addGameForm" onsubmit="addGame(event)">
                        <div>
                            <label>Название игры *</label>
                            <input type="text" id="gameTitle" required placeholder="Например: Cyberpunk 2077">
                        </div>
                        <div>
                            <label>Год выпуска *</label>
                            <input type="number" id="gameYear" required placeholder="2024" min="1990" max="2030">
                        </div>
                        <div>
                            <label>Популярность (1-100) *</label>
                            <input type="number" id="gamePopularity" required placeholder="85" min="1" max="100">
                        </div>
                        <div>
                            <label>Название файла обложки *</label>
                            <input type="text" id="gameImage" required placeholder="cyberpunk-2077.jpg">
                            <p class="image-hint">Файл должен лежать в папке images</p>
                        </div>
                        <div>
                            <label>Логин Steam *</label>
                            <input type="text" id="gameLogin" required placeholder="login">
                        </div>
                        <div>
                            <label>Пароль Steam *</label>
                            <input type="text" id="gamePassword" required placeholder="password">
                        </div>
                        <div class="full-width">
                            <label>Описание *</label>
                            <textarea id="gameDescription" required placeholder="Краткое описание игры..."></textarea>
                        </div>
                        <div class="full-width">
                            <label>Категории (выберите одну или несколько) *</label>
                            <div class="categories-checkboxes" id="catCheckboxes"></div>
                        </div>
                        <button type="submit" class="submit-btn full-width">✅ Добавить игру</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
    <div class="edit-modal-overlay" id="editModalOverlay" onclick="if(event.target===this)closeEditModal()">
        <div class="edit-modal">
            <h3>✏️ Редактирование игры <span id="editGameId"></span></h3>
            <form class="form-grid" id="editGameForm" onsubmit="saveEdit(event)">
                <div>
                    <label>Название *</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div>
                    <label>Год *</label>
                    <input type="number" id="editYear" required min="1990" max="2030">
                </div>
                <div>
                    <label>Популярность *</label>
                    <input type="number" id="editPopularity" required min="1" max="100">
                </div>
                <div>
                    <label>Файл обложки *</label>
                    <input type="text" id="editImage" required>
                </div>
                <div>
                    <label>Логин *</label>
                    <input type="text" id="editLogin" required>
                </div>
                <div>
                    <label>Пароль *</label>
                    <input type="text" id="editPassword" required>
                </div>
                <div class="full-width">
                    <label>Описание *</label>
                    <textarea id="editDescription" required></textarea>
                </div>
                <div class="full-width">
                    <label>Категории *</label>
                    <div class="categories-checkboxes" id="editCatCheckboxes"></div>
                </div>
                <div class="btn-row">
                    <button type="submit" class="submit-btn">💾 Сохранить изменения</button>
                    <button type="button" class="cancel-btn" onclick="closeEditModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

        <script>
        const ADMIN_PASSWORD = 'admin123'; // ПОМЕНЯЙ НА СВОЙ!

        const allCategories = [
            { value: 'action', label: 'Экшен' },
            { value: 'adventure', label: 'Приключения' },
            { value: 'rpg', label: 'RPG' },
            { value: 'shooter', label: 'Шутер' },
            { value: 'horror', label: 'Хоррор' },
            { value: 'survival', label: 'Выживание' },
            { value: 'simulator', label: 'Симулятор' },
            { value: 'strategy', label: 'Стратегия' },
            { value: 'racing', label: 'Гонки' },
            { value: 'openworld', label: 'Открытый мир' },
            { value: 'coop', label: 'Кооператив' },
            { value: 'stealth', label: 'Стелс' },
            { value: 'soulslike', label: 'Souls-like' },
            { value: 'roguelike', label: 'Рогалик' },
            { value: 'sandbox', label: 'Песочница' },
            { value: 'platformer', label: 'Платформер' },
            { value: 'classic', label: 'Классика' },
            { value: 'relaxing', label: 'Расслабляющая' },
            { value: 'mystic', label: 'Мистика' },
            { value: 'historical', label: 'Историческая' },
            { value: 'multiplayer', label: 'Мультиплеер' }
        ];

        let editingGameId = null;

        function checkAuth() {
            if (document.getElementById('authPassword').value === ADMIN_PASSWORD) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                initAdmin();
            } else {
                document.getElementById('authError').textContent = 'Неверный пароль';
            }
        }

        function logout() {
            document.getElementById('authOverlay').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('authPassword').value = '';
            document.getElementById('authError').textContent = '';
        }

        function getData() {
            return JSON.parse(localStorage.getItem('gamesData') || '[]');
        }

        function saveData(data) {
            localStorage.setItem('gamesData', JSON.stringify(data));
        }

        function getNextId(data) {
            return data.length > 0 ? Math.max(...data.map(g => g.id)) + 1 : 1;
        }

        // ==== РЕНДЕР ЖАЛОБ ====
        function renderReports() {
            const data = getData();
            const withReports = data.filter(g => g.reports && g.reports.length > 0);
            const container = document.getElementById('reportsContent');
            const total = withReports.reduce((s, g) => s + g.reports.length, 0);
            document.getElementById('reportsBadge').textContent = total || '';
            document.getElementById('reportsCountBadge').textContent = total || '';

            if (withReports.length === 0) {
                container.innerHTML = '<div class="no-data">✅ Жалоб нет!</div>';
                return;
            }
            let html = '<div class="table-wrap"><table><thead><tr><th>Игра</th><th>Дата</th><th>Действия</th></tr></thead><tbody>';
            withReports.forEach(game => {
                game.reports.forEach((r, i) => {
                    html += `<tr>
                        <td class="game-name">${game.title}</td>
                        <td>${new Date(r.date).toLocaleString('ru-RU')}</td>
                        <td><button class="btn-sm danger" onclick="removeReport(${game.id},${i})">✕ Снять</button></td>
                    </tr>`;
                });
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function removeReport(gameId, idx) {
            const data = getData();
            const game = data.find(g => g.id === gameId);
            if (game?.reports) {
                game.reports.splice(idx, 1);
                saveData(data);
                renderReports();
                renderAllGames();
                showSuccess('Жалоба снята');
            }
        }

        // ==== РЕНДЕР ВСЕХ ИГР ====
        function renderAllGames() {
            const data = getData();
            const tbody = document.getElementById('allGamesTable');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">Нет игр в базе</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(g => `
                <tr>
                    <td>#${g.id}</td>
                    <td><img src="images/${g.image}" style="width:50px;height:30px;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'"></td>
                    <td class="game-name">${g.title}</td>
                    <td>${g.year}</td>
                    <td>${g.popularity}</td>
                    <td>${g.category.map(c => (allCategories.find(a => a.value === c) || {label:c}).label).join(', ')}</td>
                    <td style="color:var(--accent);">${g.login}</td>
                    <td>
                        <button class="btn-sm edit-btn" onclick="openEditModal(${g.id})">✏️</button>
                        <button class="btn-sm danger" onclick="deleteGame(${g.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteGame(id) {
            if (!confirm('Точно удалить игру?')) return;
            const data = getData();
            saveData(data.filter(g => g.id !== id));
            renderAllGames();
            renderReports();
            showSuccess('Игра удалена');
        }

        // ==== РЕДАКТИРОВАНИЕ ====
        function openEditModal(id) {
            const data = getData();
            const game = data.find(g => g.id === id);
            if (!game) return;
            editingGameId = id;
            document.getElementById('editGameId').textContent = `#${id}`;
            document.getElementById('editTitle').value = game.title;
            document.getElementById('editYear').value = game.year;
            document.getElementById('editPopularity').value = game.popularity;
            document.getElementById('editImage').value = game.image;
            document.getElementById('editLogin').value = game.login;
            document.getElementById('editPassword').value = game.password;
            document.getElementById('editDescription').value = game.description;

            renderCatCheckboxes('editCatCheckboxes', game.category);
            document.getElementById('editModalOverlay').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModalOverlay').classList.remove('active');
            editingGameId = null;
        }

        function saveEdit(e) {
            e.preventDefault();
            const data = getData();
            const idx = data.findIndex(g => g.id === editingGameId);
            if (idx === -1) return;

            const checked = [];
            document.querySelectorAll('#editCatCheckboxes .cat-check.checked input').forEach(cb => checked.push(cb.value));
            if (checked.length === 0) { alert('Выберите категорию!'); return; }

            data[idx].title = document.getElementById('editTitle').value.trim();
            data[idx].year = parseInt(document.getElementById('editYear').value);
            data[idx].popularity = parseInt(document.getElementById('editPopularity').value);
            data[idx].image = document.getElementById('editImage').value.trim();
            data[idx].login = document.getElementById('editLogin').value.trim();
            data[idx].password = document.getElementById('editPassword').value.trim();
            data[idx].description = document.getElementById('editDescription').value.trim();
            data[idx].category = checked;

            saveData(data);
            closeEditModal();
            renderAllGames();
            renderReports();
            showSuccess(`Игра #${editingGameId} обновлена`);
        }

        // ==== КАТЕГОРИИ ====
        function renderCatCheckboxes(containerId, selectedCats = []) {
            const c = document.getElementById(containerId);
            if (!c) return;
            c.innerHTML = allCategories.map(cat => {
                const isChecked = selectedCats.includes(cat.value);
                return `<label class="cat-check ${isChecked ? 'checked' : ''}" data-value="${cat.value}">
                    <input type="checkbox" value="${cat.value}" ${isChecked ? 'checked' : ''}> ${cat.label}
                </label>`;
            }).join('');

            c.querySelectorAll('.cat-check').forEach(label => {
                label.addEventListener('click', function(e) {
                    e.preventDefault();
                    this.classList.toggle('checked');
                    this.querySelector('input').checked = this.classList.contains('checked');
                });
            });
        }

        function addGame(e) {
            e.preventDefault();
            const data = getData();
            const checked = [];
            document.querySelectorAll('#catCheckboxes .cat-check.checked input').forEach(cb => checked.push(cb.value));
            if (checked.length === 0) { alert('Выберите категорию!'); return; }

            data.push({
                id: getNextId(data),
                title: document.getElementById('gameTitle').value.trim(),
                year: parseInt(document.getElementById('gameYear').value),
                popularity: parseInt(document.getElementById('gamePopularity').value),
                image: document.getElementById('gameImage').value.trim(),
                login: document.getElementById('gameLogin').value.trim(),
                password: document.getElementById('gamePassword').value.trim(),
                description: document.getElementById('gameDescription').value.trim(),
                category: checked,
                reports: []
            });
            saveData(data);
            document.getElementById('addGameForm').reset();
            document.querySelectorAll('#catCheckboxes .cat-check.checked').forEach(el => el.classList.remove('checked'));
            renderAllGames();
            showSuccess('Игра добавлена!');
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function switchTab(tab) {
            document.querySelectorAll('header a').forEach(a => a.classList.remove('active'));
            ['tabReports','tabGames','tabAdd'].forEach(id => document.getElementById(id).style.display = 'none');

            if (tab === 'reports') {
                document.getElementById('tabReports').style.display = 'block';
                document.querySelector('header a[onclick*="reports"]').classList.add('active');
                renderReports();
            } else if (tab === 'games') {
                document.getElementById('tabGames').style.display = 'block';
                document.querySelector('header a[onclick*="games"]').classList.add('active');
                renderAllGames();
            } else if (tab === 'add') {
                document.getElementById('tabAdd').style.display = 'block';
                document.querySelector('header a[onclick*="add"]').classList.add('active');
                renderCatCheckboxes('catCheckboxes');
            }
        }

        function initAdmin() {
            renderCatCheckboxes('catCheckboxes');
            renderReports();
        }
    </script>
</body>
</html>
